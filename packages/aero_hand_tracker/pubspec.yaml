name: aero_hand_tracker
description: "On-device hand landmark tracking (MediaPipe Hand Landmarker) for Aerograph on Android and iOS."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.14.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.ashutoshranjan.aero_hand_tracker
        pluginClass: AeroHandTrackerPlugin
      ios:
        pluginClass: AeroHandTrackerPlugin
